<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="600" y="45" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold" letter-spacing="1">AIRBNB-SCALE VACATION RENTAL MARKETPLACE</text>
  <text x="600" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Production Scalability Architecture: Frontend, Microservices, Distributed Storage, Geo-Search, and Deployment</text>

  <!-- 1. Client Tier -->
  <g transform="translate(50, 100)" filter="url(#glow)">
    <rect width="1100" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="25" fill="#38bdf8" font-size="12" font-weight="bold">1. CLIENT TIER (Cross-Platform)</text>
    
    <rect x="40" y="35" width="280" height="35" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="180" y="57" fill="#f8fafc" font-size="12" text-anchor="middle">Web App (Next.js / React ISR)</text>

    <rect x="360" y="35" width="280" height="35" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="500" y="57" fill="#f8fafc" font-size="12" text-anchor="middle">iOS &amp; Android Apps (React Native)</text>

    <rect x="680" y="35" width="380" height="35" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="870" y="57" fill="#f8fafc" font-size="12" text-anchor="middle">Host Management Portal &amp; Admin Console</text>
  </g>

  <!-- 2. Edge and CDN Tier -->
  <g transform="translate(50, 205)" filter="url(#glow)">
    <rect width="1100" height="75" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="22" fill="#a855f7" font-size="12" font-weight="bold">2. EDGE &amp; CDN NETWORK (Global Latency &lt; 30ms)</text>
    
    <rect x="40" y="32" width="220" height="32" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="150" y="52" fill="#f8fafc" font-size="11" text-anchor="middle">Cloudflare / AWS CloudFront</text>

    <rect x="280" y="32" width="240" height="32" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="400" y="52" fill="#f8fafc" font-size="11" text-anchor="middle">DDoS Protection &amp; WAF Rules</text>

    <rect x="540" y="32" width="260" height="32" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="670" y="52" fill="#f8fafc" font-size="11" text-anchor="middle">Edge SSR Cache (Stale-While-Revalidate)</text>

    <rect x="820" y="32" width="240" height="32" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="940" y="52" fill="#f8fafc" font-size="11" text-anchor="middle">GeoDNS Routing &amp; SSL Term.</text>
  </g>

  <!-- 3. API Gateway and Security -->
  <g transform="translate(50, 305)" filter="url(#glow)">
    <rect width="1100" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="22" fill="#34d399" font-size="12" font-weight="bold">3. API GATEWAY &amp; SECURITY LAYER</text>

    <rect x="40" y="30" width="240" height="30" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="160" y="50" fill="#f8fafc" font-size="11" text-anchor="middle">Kong / AWS API Gateway</text>

    <rect x="300" y="30" width="240" height="30" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="420" y="50" fill="#f8fafc" font-size="11" text-anchor="middle">OAuth2 / JWT / Auth0 Service</text>

    <rect x="560" y="30" width="250" height="30" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="685" y="50" fill="#f8fafc" font-size="11" text-anchor="middle">Rate Limiter (Redis Token Bucket)</text>

    <rect x="830" y="30" width="230" height="30" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="945" y="50" fill="#f8fafc" font-size="11" text-anchor="middle">OpenTelemetry Tracing &amp; Logs</text>
  </g>

  <!-- 4. Microservices Tier -->
  <g transform="translate(50, 400)" filter="url(#glow)">
    <rect width="1100" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="24" fill="#f43f5e" font-size="12" font-weight="bold">4. CORE MICROSERVICES DOMAIN (Containerized on Kubernetes / EKS)</text>

    <g transform="translate(30, 38)">
      <rect width="160" height="85" rx="8" fill="#0f172a" stroke="#FF385C" stroke-width="1.5"/>
      <text x="80" y="25" fill="#FF385C" font-size="11" font-weight="bold" text-anchor="middle">Listing Service</text>
      <text x="80" y="45" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Property Details</text>
      <text x="80" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; 50+ Amenities Modal</text>
      <text x="80" y="71" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Multi-lang Translations</text>
    </g>

    <g transform="translate(210, 38)">
      <rect width="160" height="85" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="80" y="25" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">Booking Engine</text>
      <text x="80" y="45" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Double-Booking Lock</text>
      <text x="80" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; 2-Phase Hold (10m TTL)</text>
      <text x="80" y="71" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Calendar Availability</text>
    </g>

    <g transform="translate(390, 38)">
      <rect width="160" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="80" y="25" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Search &amp; Discovery</text>
      <text x="80" y="45" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Geo-Bounding Polygon</text>
      <text x="80" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Dynamic Price Filters</text>
      <text x="80" y="71" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Instant Autocomplete</text>
    </g>

    <g transform="translate(570, 38)">
      <rect width="160" height="85" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <text x="80" y="25" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">Reviews &amp; Ratings</text>
      <text x="80" y="45" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; 7 Category Breakdown</text>
      <text x="80" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Guest Favourite Score</text>
      <text x="80" y="71" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Sentiment Aggregation</text>
    </g>

    <g transform="translate(750, 38)">
      <rect width="150" height="85" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      <text x="75" y="25" fill="#a855f7" font-size="11" font-weight="bold" text-anchor="middle">Payments &amp; Ledger</text>
      <text x="75" y="45" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Stripe / Gateways</text>
      <text x="75" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Host Automated Payouts</text>
      <text x="75" y="71" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Idempotent Webhooks</text>
    </g>

    <g transform="translate(920, 38)">
      <rect width="150" height="85" rx="8" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="75" y="25" fill="#e2e8f0" font-size="11" font-weight="bold" text-anchor="middle">Realtime &amp; Notifs</text>
      <text x="75" y="45" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Host Messaging</text>
      <text x="75" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Push / SMS Dispatch</text>
      <text x="75" y="71" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; WebSocket Streams</text>
    </g>
  </g>

  <!-- 5. Event Bus Tier -->
  <g transform="translate(50, 560)" filter="url(#glow)">
    <rect width="1100" height="55" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4"/>
    <text x="20" y="20" fill="#38bdf8" font-size="11" font-weight="bold">EVENT STREAMING &amp; ASYNC WORKERS (Apache Kafka / AWS MSK)</text>
    
    <text x="200" y="40" fill="#cbd5e1" font-size="11">[Topic: ListingEvents]</text>
    <text x="420" y="40" fill="#cbd5e1" font-size="11">[Topic: BookingCreated]</text>
    <text x="640" y="40" fill="#cbd5e1" font-size="11">[Topic: PaymentSucceeded]</text>
    <text x="880" y="40" fill="#cbd5e1" font-size="11">[Topic: ReviewPublished]</text>
  </g>

  <!-- 6. Database, Search and Storage Tier -->
  <g transform="translate(50, 635)" filter="url(#glow)">
    <rect width="1100" height="135" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="22" fill="#4ade80" font-size="12" font-weight="bold">5. DISTRIBUTED STORAGE, CACHE, &amp; SEARCH TIER</text>

    <g transform="translate(30, 35)">
      <rect width="240" height="85" rx="8" fill="#0f172a" stroke="#4ade80" stroke-width="1.2"/>
      <text x="120" y="24" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">PostgreSQL / Aurora (ACID)</text>
      <text x="120" y="44" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Users, Listings, Bookings</text>
      <text x="120" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Multi-AZ Active-Passive</text>
      <text x="120" y="72" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Global Read Replicas</text>
    </g>

    <g transform="translate(290, 35)">
      <rect width="240" height="85" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="120" y="24" fill="#f43f5e" font-size="11" font-weight="bold" text-anchor="middle">Redis Cluster (ElastiCache)</text>
      <text x="120" y="44" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Calendar Availability Bitmaps</text>
      <text x="120" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Distributed Redlock</text>
      <text x="120" y="72" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Session &amp; Cart Hold State</text>
    </g>

    <g transform="translate(550, 35)">
      <rect width="240" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="120" y="24" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">OpenSearch / Elasticsearch</text>
      <text x="120" y="44" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Geo-point Spatial Indexing</text>
      <text x="120" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; 50+ Amenity Filtering Index</text>
      <text x="120" y="72" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Realtime Kafka Sync Consumer</text>
    </g>

    <g transform="translate(810, 35)">
      <rect width="260" height="85" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
      <text x="130" y="24" fill="#a855f7" font-size="11" font-weight="bold" text-anchor="middle">AWS S3 / R2 + Lambda</text>
      <text x="130" y="44" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; High-Res Property Photos</text>
      <text x="130" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Auto WebP / AVIF Compression</text>
      <text x="130" y="72" fill="#94a3b8" font-size="9" text-anchor="middle">&#8226; Signed URLs for Host Uploads</text>
    </g>
  </g>

  <!-- 7. CI/CD and Infrastructure -->
  <g transform="translate(50, 790)" filter="url(#glow)">
    <rect width="1100" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="22" fill="#f59e0b" font-size="12" font-weight="bold">6. DEPLOYMENT, CI/CD, &amp; OBSERVABILITY PIPELINE</text>

    <rect x="30" y="32" width="240" height="35" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="150" y="54" fill="#f8fafc" font-size="11" text-anchor="middle">GitHub Actions / ArgoCD GitOps</text>

    <rect x="290" y="32" width="250" height="35" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="415" y="54" fill="#f8fafc" font-size="11" text-anchor="middle">Kubernetes EKS + Karpenter Autoscaling</text>

    <rect x="560" y="32" width="250" height="35" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="685" y="54" fill="#f8fafc" font-size="11" text-anchor="middle">Prometheus + Grafana Dashboards</text>

    <rect x="830" y="32" width="240" height="35" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="950" y="54" fill="#f8fafc" font-size="11" text-anchor="middle">Terraform Multi-Region IaC</text>
  </g>
</svg>